services:
  # ============================================================================
  # 1. FastAPI Web Application Service
  # ============================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: complaint-ec-app
    restart: unless-stopped
    command: ["api"]
    ports:
      - "8077:8077"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8077/docs || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ============================================================================
  # 2. Celery Worker Service (Processes Pipeline Tasks)
  # ============================================================================
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: complaint-ec-worker
    restart: unless-stopped
    command: ["worker"]
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - app

  # ============================================================================
  # 3. Optional Local Infrastructure Services (Profile: 'infra')
  # Chỉ khởi chạy khi chỉ định `--profile infra` hoặc đặt COMPOSE_PROFILES=infra
  # ============================================================================
  local-postgres:
    profiles: ["infra"]
    image: postgres:16-alpine
    container_name: complaint-ec-local-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shared_projects}
      POSTGRES_USER: ${POSTGRES_USER:-platform_developer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Project2026!}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-platform_developer} -d ${POSTGRES_DB:-shared_projects}"]
      interval: 10s
      timeout: 5s
      retries: 5

  local-rabbitmq:
    profiles: ["infra"]
    image: rabbitmq:3-management
    container_name: complaint-ec-local-rabbitmq
    restart: unless-stopped
    ports:
      - "5674:5672"
      - "15674:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-platform_developer}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-Project2026!}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  local-redis:
    profiles: ["infra"]
    image: redis:7-alpine
    container_name: complaint-ec-local-redis
    restart: unless-stopped
    ports:
      - "6381:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  local-minio:
    profiles: ["infra"]
    image: minio/minio:RELEASE.2023-09-04T19-57-37Z
    container_name: complaint-ec-local-minio
    restart: unless-stopped
    ports:
      - "9012:9000"
      - "9013:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-platform_developer}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-Project2026!}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  rabbitmq_data:
  redis_data:
  minio_data:
